<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carta para Jose</title>
  
  <!-- Fuentes e Iconos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Model Viewer para los modelos 3D -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    /* =========================================
       ESTILOS GLOBALES Y DEL LIBRO 3D
       ========================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0d0614; 
      overflow: hidden;
    }

    .book-container {
      position: relative;
      width: 90vw;
      max-width: 420px;
      height: 85vh;
      max-height: 750px;
      perspective: 2000px;
    }

    .page {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #fff;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      transform-origin: left center;
      transition: transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1);
      transform-style: preserve-3d;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .page.flipped {
      transform: rotateY(-180deg);
      pointer-events: none;
    }

    /* =========================================
       NAVEGACIÓN
       ========================================= */
    .nav-arrows {
      position: absolute;
      bottom: 20px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 25px;
      z-index: 50;
    }
    
    .nav-arrows.center { justify-content: center; }
    .nav-arrows.right-only { justify-content: flex-end; }

    .nav-btn {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
    }

    /* =========================================
       PORTADA
       ========================================= */
    .cover-content { text-align: center; z-index: 2; }
    .cover-logo { width: 180px; margin-bottom: 20px; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5)); }
    .cover-text { font-size: 2rem; color: #fff; text-transform: uppercase; letter-spacing: 2px; text-shadow: 2px 2px 10px rgba(0,0,0,0.7), 0 0 20px rgba(255,255,255,0.3); }

    /* =========================================
       REPRODUCTOR
       ========================================= */
    .glow-bg {
      position: absolute;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(247, 127, 0, 0.45) 0%, rgba(214, 40, 40, 0.2) 50%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      z-index: 0;
      animation: floatGlow 8s ease-in-out infinite alternate;
    }

    @keyframes floatGlow {
      0% { transform: translate(-10%, -10%) scale(1); }
      100% { transform: translate(10%, 10%) scale(1.15); }
    }

    .player-card {
      position: relative;
      z-index: 1;
      width: 90%;
      background: rgba(20, 10, 18, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 140, 66, 0.25);
      border-radius: 28px;
      padding: 25px 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(232, 93, 4, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 30px;
    }
    
    .header-tag { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #ffa566; font-weight: 700; margin-bottom: 15px; background: rgba(232, 93, 4, 0.15); padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255, 165, 102, 0.3); display: flex; align-items: center; gap: 6px; }
    .disc-container { position: relative; width: 160px; height: 160px; margin: 5px 0 15px 0; display: flex; justify-content: center; align-items: center; }
    .disc { width: 150px; height: 150px; border-radius: 50%; background: conic-gradient(from 0deg, #e85d04, #f77f00, #d62828, #f77f00, #e85d04); padding: 4px; box-shadow: 0 10px 30px rgba(232, 93, 4, 0.4), 0 0 0 8px rgba(255, 255, 255, 0.03); transition: transform 0.3s ease; }
    .disc-inner { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at center, #150914 30%, #2b0e1f 60%, #110510 100%); display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; border: 3px solid rgba(255, 154, 60, 0.3); }
    .disc-inner::before { content: ''; position: absolute; width: 80%; height: 80%; border-radius: 50%; border: 1px dashed rgba(255, 255, 255, 0.15); box-shadow: 0 0 0 12px rgba(255, 255, 255, 0.03), 0 0 0 24px rgba(255, 255, 255, 0.03); }
    .center-hole { width: 35px; height: 35px; background: linear-gradient(135deg, #f77f00, #d62828); border-radius: 50%; border: 4px solid #1a0a16; z-index: 2; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
    .center-hole i { color: #fff; font-size: 0.8rem; }
    .disc.spinning { animation: spin 12s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    
    .track-info { text-align: center; width: 100%; margin-bottom: 15px; }
    .track-title { font-size: 1.1rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
    .track-artist { font-size: 0.85rem; color: #fca311; font-weight: 600; opacity: 0.9; }
    
    .progress-area { width: 100%; margin-bottom: 15px; }
    .progress-bar-container { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; cursor: pointer; position: relative; overflow: hidden; }
    .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #f77f00, #ffba08); border-radius: 10px; transition: width 0.1s linear; box-shadow: 0 0 12px rgba(247, 127, 0, 0.8); }
    .time-stamps { display: flex; justify-content: space-between; margin-top: 6px; font-size: 0.7rem; color: #d8b4a0; font-weight: 600; }
    
    .controls { display: flex; align-items: center; justify-content: center; gap: 15px; width: 100%; margin-bottom: 15px; }
    .btn { background: none; border: none; color: #ffd8be; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.2s ease; outline: none; }
    .btn:hover { color: #fff; transform: scale(1.1); }
    .btn-secondary { font-size: 1.1rem; width: 38px; height: 38px; border-radius: 50%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); }
    .btn-main { width: 54px; height: 54px; border-radius: 50%; background: linear-gradient(135deg, #e85d04 0%, #f77f00 100%); color: #fff; font-size: 1.4rem; box-shadow: 0 8px 20px rgba(232, 93, 4, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.3); }
    
    .volume-container { display: flex; align-items: center; gap: 10px; width: 90%; background: rgba(0, 0, 0, 0.25); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.05); }
    .volume-icon { color: #fca311; font-size: 0.8rem; cursor: pointer; width: 16px; text-align: center; }
    .volume-slider { flex: 1; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 5px; background: rgba(255, 255, 255, 0.2); outline: none; }
    .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #f77f00; cursor: pointer; box-shadow: 0 0 8px rgba(247, 127, 0, 0.8); }
    .status-msg { margin-top: 10px; font-size: 0.7rem; color: rgba(255, 216, 190, 0.6); font-weight: 600; }
    #youtube-player-container { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden; }

    /* =========================================
       GALERÍA Y LIGHTBOX
       ========================================= */
    .gallery-img {
      max-width: 85%; max-height: 60%;
      border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      cursor: pointer; transition: transform 0.3s;
      border: 2px solid rgba(255,255,255,0.2);
    }
    .gallery-img:hover { transform: scale(1.03); }
    
    .hint-text {
      margin-top: 15px; color: rgba(255,255,255,0.8); font-size: 0.85rem;
      background: rgba(0,0,0,0.4); padding: 5px 12px; border-radius: 15px; backdrop-filter: blur(5px);
    }

    #lightbox {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center;
      padding: 20px; cursor: zoom-out; backdrop-filter: blur(8px);
    }
    #lightbox img {
      max-width: 95%; max-height: 95%; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); object-fit: contain;
    }

    /* =========================================
       VISOR 3D
       ========================================= */
    model-viewer {
      width: 100%; height: 75%; outline: none; --poster-color: transparent;
    }
  </style>
</head>
<body>

  <div class="book-container">
    
    <!-- PÁGINA 0: PORTADA -->
    <div class="page" id="p0" style="z-index: 7; background: url('Imagen/FondoPortada.jpg') center/cover no-repeat;">
      <div class="cover-content">
        <img src="Imagen/logo 1.png" alt="Logo" class="cover-logo">
        <h1 class="cover-text">De jenny<br>para Jose</h1>
      </div>
      <div class="nav-arrows right-only">
        <button class="nav-btn" onclick="flipPage(0, true)">Abrir <i class="fa-solid fa-arrow-right"></i></button>
      </div>
    </div>

    <!-- PÁGINA 1: REPRODUCTOR -->
    <div class="page" id="p1" style="z-index: 6; background: url('Imagen/Fondo 1.jpg') center/cover no-repeat;">
      <div class="glow-bg"></div>
      <div class="player-card">
        <div class="header-tag"><i class="fa-solid fa-compact-disc"></i> Sunset Music Player</div>
        <div class="disc-container">
          <div class="disc" id="disc-element">
            <div class="disc-inner"><div class="center-hole"><i class="fa-solid fa-music"></i></div></div>
          </div>
        </div>
        <div class="track-info">
          <h2 class="track-title" id="track-title">Cargando lista...</h2>
          <p class="track-artist" id="track-artist">Mi Playlist de YouTube</p>
        </div>
        <div class="progress-area">
          <div class="progress-bar-container" id="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
          <div class="time-stamps"><span id="current-time">0:00</span><span id="duration-time">0:00</span></div>
        </div>
        <div class="controls">
          <button class="btn btn-secondary" id="btn-prev" title="Anterior"><i class="fa-solid fa-backward-step"></i></button>
          <button class="btn btn-main" id="btn-play-pause" title="Reproducir/Pausar"><i class="fa-solid fa-play" id="play-icon"></i></button>
          <button class="btn btn-secondary" id="btn-next" title="Siguiente"><i class="fa-solid fa-forward-step"></i></button>
        </div>
        <div class="volume-container">
          <i class="fa-solid fa-volume-high volume-icon" id="volume-btn"></i>
          <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="80">
        </div>
        <div class="status-msg" id="status-msg">Haz clic en Play para comenzar</div>
      </div>
      <div class="nav-arrows">
        <button class="nav-btn" onclick="flipPage(1, false)"><i class="fa-solid fa-arrow-left"></i> Anterior</button>
        <button class="nav-btn" onclick="flipPage(1, true)">Siguiente <i class="fa-solid fa-arrow-right"></i></button>
      </div>
    </div>

    <!-- PÁGINA 2: IMAGEN 1 -->
    <div class="page" id="p2" style="z-index: 5; background: url('Imagen/Fondo 2.jpg') center/cover no-repeat;">
      <img src="Imagen/Imagen 1.png" alt="Imagen 1" class="gallery-img" onclick="openLightbox(this.src)">
      <p class="hint-text"><i class="fa-solid fa-magnifying-glass-plus"></i> Toca la imagen para ampliar</p>
      <div class="nav-arrows">
        <button class="nav-btn" onclick="flipPage(2, false)"><i class="fa-solid fa-arrow-left"></i></button>
        <button class="nav-btn" onclick="flipPage(2, true)"><i class="fa-solid fa-arrow-right"></i></button>
      </div>
    </div>

    <!-- PÁGINA 3: IMAGEN 2 -->
    <!-- Nota: Aquí respetamos la "f" minúscula que mostrabas en tu captura de archivos (fondo 3.jpg) -->
    <div class="page" id="p3" style="z-index: 4; background: url('Imagen/fondo 3.jpg') center/cover no-repeat;">
      <img src="Imagen/Imagen 2.png" alt="Imagen 2" class="gallery-img" onclick="openLightbox(this.src)">
      <p class="hint-text"><i class="fa-solid fa-magnifying-glass-plus"></i> Toca la imagen para ampliar</p>
      <div class="nav-arrows">
        <button class="nav-btn" onclick="flipPage(3, false)"><i class="fa-solid fa-arrow-left"></i></button>
        <button class="nav-btn" onclick="flipPage(3, true)"><i class="fa-solid fa-arrow-right"></i></button>
      </div>
    </div>

    <!-- PÁGINA 4: MODELO 3D 1 -->
    <div class="page" id="p4" style="z-index: 3; background-color: #ABC0D5;">
      <model-viewer src="assets/Modelo 1.glb" auto-rotate camera-controls shadow-intensity="1" interaction-prompt="none"></model-viewer>
      <p class="hint-text" style="color: #333; background: rgba(255,255,255,0.4);"><i class="fa-solid fa-hand-pointer"></i> Gira el modelo 3D</p>
      <div class="nav-arrows">
        <button class="nav-btn" onclick="flipPage(4, false)" style="color:#333; border-color:#333;"><i class="fa-solid fa-arrow-left"></i></button>
        <button class="nav-btn" onclick="flipPage(4, true)" style="color:#333; border-color:#333;"><i class="fa-solid fa-arrow-right"></i></button>
      </div>
    </div>

    <!-- PÁGINA 5: MODELO 3D 2 -->
    <div class="page" id="p5" style="z-index: 2; background-color: #658DBE;">
      <model-viewer src="assets/Modelo 2.glb" auto-rotate camera-controls shadow-intensity="1" interaction-prompt="none"></model-viewer>
      <p class="hint-text" style="color: #fff; background: rgba(0,0,0,0.2);"><i class="fa-solid fa-hand-pointer"></i> Gira el modelo 3D</p>
      <div class="nav-arrows">
        <button class="nav-btn" onclick="flipPage(5, false)"><i class="fa-solid fa-arrow-left"></i></button>
        <button class="nav-btn" onclick="flipPage(5, true)"><i class="fa-solid fa-arrow-right"></i></button>
      </div>
    </div>

    <!-- PÁGINA 6: MODELO 3D 3 -->
    <div class="page" id="p6" style="z-index: 1; background-color: #3D8EC3;">
      <model-viewer src="assets/Modelo 3.glb" auto-rotate camera-controls shadow-intensity="1" interaction-prompt="none"></model-viewer>
      <p class="hint-text" style="color: #fff; background: rgba(0,0,0,0.2);"><i class="fa-solid fa-hand-pointer"></i> Gira el modelo 3D</p>
      <div class="nav-arrows center">
        <button class="nav-btn" onclick="flipPage(6, false)"><i class="fa-solid fa-arrow-left"></i> Volver</button>
      </div>
    </div>

  </div> <!-- Fin de contenedor de hojas -->

  <!-- Lightbox (Zoom de imagen) -->
  <div id="lightbox" onclick="this.style.display='none'">
    <img id="lightbox-img" src="">
  </div>

  <!-- Contenedor Oculto de YouTube -->
  <div id="youtube-player-container">
    <div id="yt-player"></div>
  </div>

  <!-- SCRIPTS -->
  <script>
    function flipPage(currentIndex, forward) {
      if (forward) {
        document.getElementById(`p${currentIndex}`).classList.add('flipped');
      } else {
        const prevPage = document.getElementById(`p${currentIndex - 1}`);
        if (prevPage) prevPage.classList.remove('flipped');
      }
    }

    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').style.display = 'flex';
    }

    const PLAYLIST_ID = 'PL2bLbUjoySk6Je3c-R_rsOWIPA0SQEs1c';
    let player;
    let isPlaying = false;
    let updateTimer;

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        height: '1', width: '1',
        playerVars: { 'listType': 'playlist', 'list': PLAYLIST_ID, 'index': 0, 'autoplay': 0, 'controls': 0 },
        events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange }
      });
    }

    const playPauseBtn = document.getElementById('btn-play-pause');
    const playIcon = document.getElementById('play-icon');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    const trackTitle = document.getElementById('track-title');
    const trackArtist = document.getElementById('track-artist');
    const disc = document.getElementById('disc-element');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const currentTimeEl = document.getElementById('current-time');
    const durationTimeEl = document.getElementById('duration-time');
    const volumeSlider = document.getElementById('volume-slider');
    const volumeBtn = document.getElementById('volume-btn');
    const statusMsg = document.getElementById('status-msg');

    function onPlayerReady(event) {
      statusMsg.innerText = "Lista cargada correctamente";
      updateTrackInfo();
      player.setVolume(volumeSlider.value);
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true; playIcon.className = "fa-solid fa-pause"; disc.classList.add('spinning'); statusMsg.innerText = "Reproduciendo...";
        startProgressLoop(); updateTrackInfo();
      } else if (event.data === YT.PlayerState.PAUSED) {
        isPlaying = false; playIcon.className = "fa-solid fa-play"; disc.classList.remove('spinning'); statusMsg.innerText = "Pausado";
        stopProgressLoop();
      } else if (event.data === YT.PlayerState.BUFFERING) {
        statusMsg.innerText = "Cargando audio...";
      } else if (event.data === YT.PlayerState.ENDED) {
        isPlaying = false; playIcon.className = "fa-solid fa-play"; disc.classList.remove('spinning');
        stopProgressLoop();
      }
    }

    function updateTrackInfo() {
      if (!player || !player.getVideoData) return;
      const data = player.getVideoData();
      if (data && data.title) {
        trackTitle.innerText = data.title;
        trackArtist.innerText = data.author || "YouTube Playlist";
      }
    }

    playPauseBtn.addEventListener('click', () => {
      if (!player) return;
      if (isPlaying) { player.pauseVideo(); } else { player.playVideo(); }
    });

    nextBtn.addEventListener('click', () => { if (player) player.nextVideo(); });
    prevBtn.addEventListener('click', () => { if (player) player.previousVideo(); });

    volumeSlider.addEventListener('input', (e) => {
      const val = e.target.value;
      if (player) player.setVolume(val);
      if (val == 0) volumeBtn.className = "fa-solid fa-volume-xmark volume-icon";
      else if (val < 50) volumeBtn.className = "fa-solid fa-volume-low volume-icon";
      else volumeBtn.className = "fa-solid fa-volume-high volume-icon";
    });

    let isMuted = false;
    let lastVol = 80;
    volumeBtn.addEventListener('click', () => {
      if (!player) return;
      if (!isMuted) {
        lastVol = volumeSlider.value;
        volumeSlider.value = 0; player.setVolume(0);
        volumeBtn.className = "fa-solid fa-volume-xmark volume-icon"; isMuted = true;
      } else {
        volumeSlider.value = lastVol; player.setVolume(lastVol);
        volumeBtn.className = lastVol > 50 ? "fa-solid fa-volume-high volume-icon" : "fa-solid fa-volume-low volume-icon"; isMuted = false;
      }
    });

    progressContainer.addEventListener('click', (e) => {
      if (!player || !player.getDuration) return;
      const width = progressContainer.clientWidth;
      const clickX = e.offsetX;
      const duration = player.getDuration();
      if (duration > 0) {
        const seekTime = (clickX / width) * duration;
        player.seekTo(seekTime, true);
      }
    });

    function startProgressLoop() {
      stopProgressLoop(); updateProgress(); updateTimer = setInterval(updateProgress, 500);
    }
    function stopProgressLoop() { if (updateTimer) clearInterval(updateTimer); }

    function updateProgress() {
      if (!player || !player.getCurrentTime || !player.getDuration) return;
      const current = player.getCurrentTime() || 0;
      const duration = player.getDuration() || 0;
      if (duration > 0) {
        const pct = (current / duration) * 100;
        progressBar.style.width = pct + '%';
        currentTimeEl.innerText = formatTime(current);
        durationTimeEl.innerText = formatTime(duration);
      }
      updateTrackInfo();
    }

    function formatTime(seconds) {
      const sec = Math.floor(seconds);
      const mins = Math.floor(sec / 60);
      const remainingSecs = sec % 60;
      return mins + ':' + (remainingSecs < 10 ? '0' : '') + remainingSecs;
    }
  </script>
</body>
</html>
