<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carta para Jose</title>
  
  <!-- Fuentes e Iconos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Model Viewer para los modelos 3D -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    /* =========================================
       ESTILOS GLOBALES Y DEL LIBRO 3D
       ========================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0d0614; 
      overflow: hidden;
    }

    .book-container {
      position: relative;
      width: 90vw;
      max-width: 420px;
      height: 85vh;
      max-height: 750px;
      perspective: 2500px;
    }

    .page {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #fff;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      transform-origin: left center;
      transition: transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1);
      transform-style: preserve-3d;
      
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 20px;
    }

    .page.flipped {
      transform: rotateY(-180deg);
      pointer-events: none;
    }

    /* =========================================
       NAVEGACIÓN
       ========================================= */
    .nav-arrows {
      position: absolute;
      bottom: 20px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 25px;
      z-index: 50;
    }
    
    .nav-arrows.center { justify-content: center; }
    .nav-arrows.right-only { justify-content: flex-end; }

    .nav-btn {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
    }

    /* =========================================
       PORTADA
       ========================================= */
    .cover-content { text-align: center; z-index: 2; }
    .cover-logo { width: 180px; margin-bottom: 10px; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5)); }
    .cover-text { 
      font-family: 'Dancing Script', cursive; 
      font-size: 3.5rem; 
      line-height: 1.1;
      color: #fff; 
      text-shadow: 2px 2px 10px rgba(0,0,0,0.8), 0 0 20px rgba(255,255,255,0.4); 
    }

    /* =========================================
       GALERÍA Y LIGHTBOX
       ========================================= */
    .gallery-img {
      max-width: 90%; max-height: 60%;
      border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      cursor: pointer; transition: transform 0.3s;
      border: 2px solid rgba(255,255,255,0.2);
    }
    .gallery-img:hover { transform: scale(1.03); }
    
    .hint-text {
      margin-top: 15px; color: rgba(255,255,255,0.9); font-size: 0.85rem;
      background: rgba(0,0,0,0.5); padding: 6px 14px; border-radius: 15px; backdrop-filter: blur(5px);
    }

    #lightbox {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center;
      padding: 20px; cursor: zoom-out; backdrop-filter: blur(8px);
    }
    #lightbox img {
      max-width: 95%; max-height: 95%; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); object-fit: contain;
    }

    /* =========================================
       VISOR 3D (Cajas flotantes)
       ========================================= */
    .model-wrapper {
      width: 85%;
      height: 65%;
      background: rgba(255, 255, 255, 0.15); 
      border-radius: 20px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.3);
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px; 
    }

    model-viewer {
      width: 100%; 
      height: 100%; 
      outline: none; 
      --poster-color: transparent;
    }
  </style>
</head>
<body>

  <div class="book-container">
    
    <!-- PÁGINA 0: PORTADA -->
    <div class="page" id="p0" style="z-index: 6; background: url('Imagen/FondoPortada.jpg') center/cover no-repeat;">
      <div class="cover-content">
        <img src="Imagen/logo 1.png" alt="Logo" class="cover-logo">
        <h1 class="cover-text">De Jenny<br>para Jose</h1>
      </div>
      <div class="nav-arrows right-only">
        <button class="nav-btn" onclick="flipPage(0, true)">Abrir <i class="fa-solid fa-arrow-right"></i></button>
      </div>
    </div>

    <!-- PÁGINA 1: IMAGEN 1 -->
    <div class="page" id="p1" style="z-index: 5; background: url('Imagen/Fondo 2.jpg') center/cover no-repeat;">
      <img src="Imagen/Imagen 1.png" alt="Imagen 1" class="gallery-img" onclick="openLightbox(this.src)">
      <p class="hint-text"><i class="fa-solid fa-magnifying-glass-plus"></i> Toca la imagen para ampliar</p>
      <div class="nav-arrows">
        <button class="nav-btn" onclick="flipPage(1, false)"><i class="fa-solid fa-arrow-left"></i></button>
        <button class="nav-btn" onclick="flipPage(1, true)"><i class="fa-solid fa-arrow-right"></i></button>
      </div>
    </div>

    <!-- PÁGINA 2: IMAGEN 2 -->
    <div class="page" id="p2" style="z-index: 4; background: url('Imagen/fondo 3.jpg') center/cover no-repeat;">
      <img src="Imagen/Imagen 2.png" alt="Imagen 2" class="gallery-img" onclick="openLightbox(this.src)">
      <p class="hint-text"><i class="fa-solid fa-magnifying-glass-plus"></i> Toca la imagen para ampliar</p>
      <div class="nav-arrows">
        <button class="nav-btn" onclick="flipPage(2, false)"><i class="fa-solid fa-arrow-left"></i></button>
        <button class="nav-btn" onclick="flipPage(2, true)"><i class="fa-solid fa-arrow-right"></i></button>
      </div>
    </div>

    <!-- PÁGINA 3: MODELO 3D 1 -->
    <div class="page" id="p3" style="z-index: 3; background: #ABC0D5 url('Imagen/fondo 4.jpg') center/cover no-repeat;">
      <div class="model-wrapper">
        <model-viewer src="assets/Modelo 1.glb" auto-rotate camera-controls shadow-intensity="1" interaction-prompt="none"></model-viewer>
      </div>
      <p class="hint-text"><i class="fa-solid fa-hand-pointer"></i> Gira el modelo 3D</p>
      <div class="nav-arrows">
        <button class="nav-btn" onclick="flipPage(3, false)"><i class="fa-solid fa-arrow-left"></i></button>
        <button class="nav-btn" onclick="flipPage(3, true)"><i class="fa-solid fa-arrow-right"></i></button>
      </div>
    </div>

    <!-- PÁGINA 4: MODELO 3D 2 -->
    <div class="page" id="p4" style="z-index: 2; background: #658DBE url('Imagen/fondo 5.jpg') center/cover no-repeat;">
      <div class="model-wrapper">
        <model-viewer src="assets/Modelo 2.glb" auto-rotate camera-controls shadow-intensity="1" interaction-prompt="none"></model-viewer>
      </div>
      <p class="hint-text"><i class="fa-solid fa-hand-pointer"></i> Gira el modelo 3D</p>
      <div class="nav-arrows">
        <button class="nav-btn" onclick="flipPage(4, false)"><i class="fa-solid fa-arrow-left"></i></button>
        <button class="nav-btn" onclick="flipPage(4, true)"><i class="fa-solid fa-arrow-right"></i></button>
      </div>
    </div>

    <!-- PÁGINA 5: MODELO 3D 3 (Última hoja) -->
    <div class="page" id="p5" style="z-index: 1; background: #3D8EC3 url('Imagen/fondo 6.jpg') center/cover no-repeat;">
      <div class="model-wrapper">
        <model-viewer src="assets/Modelo 3.glb" auto-rotate camera-controls shadow-intensity="1" interaction-prompt="none"></model-viewer>
      </div>
      <p class="hint-text"><i class="fa-solid fa-hand-pointer"></i> Gira el modelo 3D</p>
      <div class="nav-arrows center">
        <button class="nav-btn" onclick="flipPage(5, false)"><i class="fa-solid fa-arrow-left"></i> Volver</button>
      </div>
    </div>

  </div> <!-- Fin de contenedor de hojas -->

  <!-- Lightbox (Zoom de imagen) -->
  <div id="lightbox" onclick="this.style.display='none'">
    <img id="lightbox-img" src="">
  </div>

  <!-- SCRIPTS -->
  <script>
    // --- 1. LÓGICA DEL LIBRO 3D ---
    function flipPage(currentIndex, forward) {
      if (forward) {
        document.getElementById(`p${currentIndex}`).classList.add('flipped');
      } else {
        const prevPage = document.getElementById(`p${currentIndex - 1}`);
        if (prevPage) prevPage.classList.remove('flipped');
      }
    }

    // --- 2. LÓGICA DE GALERÍA ZOOM ---
    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').style.display = 'flex';
    }
  </script>
</body>
</html>
